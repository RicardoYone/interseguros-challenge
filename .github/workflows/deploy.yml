name: Deploy

# Manual on purpose: it creates resources in Azure. See docs/deployment.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [qr-api, statistics-api]
    steps:
      - uses: actions/checkout@v7
      # Image names must be lowercase, and the owner of the repository may not be.
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/interseguros" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish-images
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/interseguros" >> "$GITHUB_ENV"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and APIs
        id: infrastructure
        env:
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
          DEMO_PASSWORD_HASH_B64: ${{ secrets.DEMO_PASSWORD_HASH_B64 }}
        run: |
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              qrApiImage="$IMAGE_PREFIX-qr-api:$GITHUB_SHA" \
              statisticsApiImage="$IMAGE_PREFIX-statistics-api:$GITHUB_SHA" \
              jwtPrivateKeyB64="$JWT_PRIVATE_KEY_B64" \
              jwtPublicKeyB64="$JWT_PUBLIC_KEY_B64" \
              demoPasswordHashB64="$DEMO_PASSWORD_HASH_B64" \
            --query properties.outputs --output json)
          {
            echo "qr_api_url=$(jq -r .qrApiUrl.value <<< "$outputs")"
            echo "statistics_api_url=$(jq -r .statisticsApiUrl.value <<< "$outputs")"
            echo "static_web_app=$(jq -r .staticWebAppName.value <<< "$outputs")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the frontend for these APIs
        working-directory: web
        env:
          QR_API_URL: ${{ steps.infrastructure.outputs.qr_api_url }}
          STATISTICS_API_URL: ${{ steps.infrastructure.outputs.statistics_api_url }}
        run: |
          npm ci
          npm run build
          printf '{"statisticsApiUrl":"%s","qrApiUrl":"%s"}\n' "$STATISTICS_API_URL" "$QR_API_URL" \
            > dist/web/browser/config.json

      - name: Read the deployment token of the static site
        id: static-site
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ steps.infrastructure.outputs.static_web_app }}" \
            --query properties.apiKey --output tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-site.outputs.token }}
          action: upload
          app_location: web/dist/web/browser
          skip_app_build: true
          skip_api_build: true
