server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:3000 http://localhost:8080; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Client-side routes such as /login are served by the application itself.
  location / {
    try_files $uri /index.html;
  }
}
