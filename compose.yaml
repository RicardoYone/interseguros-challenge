# Runs the whole system locally. Generate the .env file it reads with:
#   npm --prefix services/statistics-api run generate-env
#
# Each service receives only the variables it needs: qr-api gets the public key and
# never the private one, which is what prevents it from forging tokens.
services:
  statistics-api:
    build: ./services/statistics-api
    environment:
      TZ: America/Lima
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?run generate-env first}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?run generate-env first}
      JWT_ISSUER: ${JWT_ISSUER:?run generate-env first}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?run generate-env first}
      DEMO_USERNAME: ${DEMO_USERNAME:?run generate-env first}
      DEMO_PASSWORD_HASH_B64: ${DEMO_PASSWORD_HASH_B64:?run generate-env first}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?run generate-env first}
    ports:
      - "3000:3000"

  qr-api:
    build: ./services/qr-api
    environment:
      TZ: America/Lima
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64:?run generate-env first}
      JWT_ISSUER: ${JWT_ISSUER:?run generate-env first}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?run generate-env first}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?run generate-env first}
      STATISTICS_API_URL: http://statistics-api:3000
    # Longer than the time qr-api gives in-flight requests to finish.
    stop_grace_period: 40s
    ports:
      - "8080:8080"
    depends_on:
      statistics-api:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "4200:8080"
    depends_on:
      - qr-api
